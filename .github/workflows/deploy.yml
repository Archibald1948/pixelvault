name: Deploy demo (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.VERCEL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: ./scripts/build-wasm.sh
      - working-directory: packages/pixelvault
        run: npm ci && npm run build
      - working-directory: www
        run: npm ci

      # 이 데모는 서버 기능이 없는 정적 사이트라 그대로 내보낸다 (scripts/build-vercel-output.mjs 주석 참고)
      - name: Build static site
        working-directory: www
        env:
          PIXELVAULT_STATIC_EXPORT: "1"
        run: npm run build
      - run: node scripts/build-vercel-output.mjs

      - run: npm install --global vercel@latest
      - working-directory: www
        run: vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
