# npm 배포 — Trusted Publishing (OIDC)
#
# 토큰도, 2FA 승인도 필요 없다. GitHub Actions 가 발급한 OIDC 토큰을 npm 이 검증해서
# "이 레포의 이 워크플로가 맞다"고 확인되면 배포를 허용한다.
# (npmjs.com → 패키지 → Settings → Trusted Publisher 에 레포와 이 파일명이 등록되어 있어야 한다)
#
# 릴리스 방법:
#   cd packages/pixelvault && npm version patch   # package.json 버전 상승 + 커밋 + 태그
#   git push --follow-tags                        # v0.1.1 태그가 올라가면 이 워크플로가 배포한다
#
# 수동 실행(workflow_dispatch)은 기본이 dry-run 이라 실제로 올리지 않는다.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "빌드와 패키징만 하고 실제 배포는 건너뛴다"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC 토큰 발급 권한. 이게 없으면 trusted publishing 이 동작하지 않는다

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools # libwebp(C) 를 wasm 정적 라이브러리로 묶는 데 필요
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing 은 npm 11.5.1 이상에서만 동작한다 (setup-node 가 깔아 주는 버전은 더 낮다)
      - name: Use npm with trusted publishing support
        run: |
          npm install --global npm@^11.9.0
          npm --version

      - name: Build wasm
        run: ./scripts/build-wasm.sh

      - name: Build package
        working-directory: packages/pixelvault
        run: npm ci && npm run build

      # 태그(v0.1.1)와 package.json 의 version 이 어긋난 채로 배포되는 사고를 막는다
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/pixelvault
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::태그와 package.json 버전이 다릅니다"; exit 1; }

      # dry-run 은 "빌드가 성공하고 패키지 내용이 맞는지" 확인용이다.
      # npm publish --dry-run 은 이미 배포된 버전이면 실패하므로(정상 동작) 여기서는 쓰지 않는다.
      - name: Validate package (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/pixelvault
        run: |
          npm pack --dry-run
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION 은 이미 배포되어 있습니다. 릴리스하려면 버전을 올리세요 (npm version patch)."
          else
            echo "$NAME@$VERSION 은 아직 배포되지 않았습니다. v$VERSION 태그를 밀면 배포됩니다."
          fi

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        working-directory: packages/pixelvault
        run: npm publish # 인증 없음: OIDC 로 자동 처리되고 provenance 도 함께 생성된다
