name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: WASM · npm package · demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          # llvm-ar: libwebp(C) 오브젝트를 wasm 용 정적 라이브러리로 묶는 데 필요 (docs/libwebp-on-wasm.md)
          components: llvm-tools, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ubuntu-latest 에는 wasm32 타깃을 지원하는 clang 이 기본 설치되어 있다
      - name: Clippy (wasm32)
        run: |
          export AR_wasm32_unknown_unknown="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-ar"
          cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Build wasm (+ link check + size budget)
        run: ./scripts/build-wasm.sh
      - name: Test wasm in Node
        run: ./scripts/test-wasm.sh

      - name: Build npm package
        working-directory: packages/pixelvault
        run: |
          npm ci
          npm run build
          npm pack --dry-run

      - name: Lint & build demo site
        working-directory: www
        run: |
          npm ci
          npm run lint
          npm run build
